<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NoCali</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322C55E'/%3E%3Cpath d='M7 17h4l2.5-7 5 13 2.5-6H25' stroke='%230F172A' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Design system: design-system/nocali/MASTER.md + pages/dashboard.md -->
<style>
  :root {
    color-scheme: dark;
    --bg: #0F172A; --card: #1B2336; --muted: #272F42; --fg: #F8FAFC; --fg-muted: #94A3B8;
    --border: #334155; --border-strong: #64748B; --accent: #22C55E; --on-accent: #0F172A;
    --accent-tint: rgba(34, 197, 94, .12); --warn: #F59E0B; --danger: #F87171; --info: #38BDF8; --ring: #FFFFFF;
    --font-sans: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 12px; --radius-sm: 8px;
    --dur-fast: 150ms; --dur-base: 250ms; --dur-slow: 600ms;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #F8FAFC; --card: #FFFFFF; --muted: #F1F5F9; --fg: #0F172A; --fg-muted: #475569;
      --border: #E2E8F0; --border-strong: #7C8BA1; --accent: #15803D; --on-accent: #FFFFFF;
      --accent-tint: rgba(21, 128, 61, .08); --warn: #B45309; --danger: #DC2626; --info: #0369A1; --ring: #0F172A;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; }
    .pulse { animation: none !important; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-sans); }
  a { color: inherit; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .icon { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .icon.sm { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 4px; }

  /* top bar */
  .topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(140%) blur(8px); -webkit-backdrop-filter: saturate(140%) blur(8px); border-bottom: 1px solid var(--border); }
  .topbar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-right: auto; }
  .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .brand-mark .icon { width: 18px; height: 18px; stroke-width: 2.4; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-muted); flex: none; }
  .dot.on { background: var(--accent); } .dot.bad { background: var(--danger); } .dot.wait { background: var(--warn); }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button { min-height: 36px; min-width: 40px; border: 0; background: transparent; color: var(--fg-muted); font: 600 13px var(--font-sans); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--muted); color: var(--fg); }
  .icon-btn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: transparent; color: var(--fg); cursor: pointer; transition: background var(--dur-fast); }
  .icon-btn:hover { background: var(--muted); }

  /* layout */
  main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
  .grid { display: grid; gap: 16px; }
  .col { display: grid; gap: 16px; align-content: start; min-width: 0; }
  @media (min-width: 768px) { main { padding: 24px 24px 56px; } .topbar-in { padding: 10px 24px; } }
  @media (min-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
  }
  @media (max-width: 899px) {  /* single column order: status, send, camera, rest */
    .grid, .col { display: contents; }
    .grid { display: flex; flex-direction: column; gap: 16px; }
    #cardStatus { order: 1; } #pAlerts { order: 2; } #cardSend { order: 3; } #cardCam { order: 4; }
    #cardTemps { order: 5; } #cardMachine { order: 6; } #cardAms { order: 7; }
    #pAlerts:empty { display: none; }
  }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
  @media (max-width: 479px) { .card { padding: 16px; } }
  .card-title { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); }
  .card-title .spacer { margin-left: auto; }

  /* buttons */
  .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
    border-radius: var(--radius-sm); border: 1px solid transparent; font: 600 15px var(--font-sans); cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--on-accent); transition: filter var(--dur-fast), background var(--dur-fast); }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: transparent; color: var(--fg); border-color: var(--border-strong); }
  .btn.secondary:hover { background: var(--muted); filter: none; }
  .btn:disabled { opacity: .55; cursor: not-allowed; filter: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* status hero */
  .status-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .p-name { font-size: 14px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }
  .p-state { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin: 4px 0 2px; }
  .p-job { font-size: 14px; color: var(--fg-muted); overflow-wrap: anywhere; }
  .p-pct { font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
  .p-pct small { font-size: 18px; color: var(--fg-muted); margin-left: 2px; }
  .bar { height: 8px; background: var(--muted); border-radius: 999px; overflow: hidden; margin: 18px 0 14px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width var(--dur-slow) ease-out; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
  .stat .icon { color: var(--fg-muted); margin-top: 2px; }
  .stat small { display: block; font-size: 12px; color: var(--fg-muted); }
  .stat b { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 479px) {
    .stats { gap: 8px; } .stat { gap: 6px; } .stat .icon { display: none; } .stat b { font-size: 15px; }
    .tile b { font-size: 18px; } .tile b span { display: block; font-size: 12px; margin-top: 2px; }
  }
  .stage { margin-top: 16px; display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--muted); }
  .stage.cali { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); font-weight: 600; }
  .p-msg { margin-top: 12px; font-size: 14px; color: var(--fg-muted); }
  .p-msg.err { color: var(--danger); }
  .empty-state { text-align: center; padding: 8px 0; }
  .empty-state p { margin: 6px 0 16px; color: var(--fg-muted); }

  /* alerts */
  .alerts { display: grid; gap: 10px; }
  .alert { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--border);
    border-left: 4px solid var(--danger); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; }
  .alert .icon { color: var(--danger); margin-top: 1px; }
  .alert.lvl3 { border-left-color: var(--warn); } .alert.lvl3 .icon { color: var(--warn); }
  .alert.lvl4 { border-left-color: var(--info); } .alert.lvl4 .icon { color: var(--info); }
  .alert b { display: block; }
  .alert .meta { color: var(--fg-muted); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .alert a { display: inline-flex; gap: 4px; align-items: center; }

  /* camera */
  .cam { position: relative; background: #000; border-radius: var(--radius-sm); overflow: hidden; aspect-ratio: 16 / 9; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam-overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: #CBD5E1; font-size: 14px; }
  .cam-overlay .btn { margin-top: 10px; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--muted); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
  .tile small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); }
  .tile b { display: block; font: 600 20px var(--font-mono); font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
  .tile b span { font-size: 13px; color: var(--fg-muted); font-weight: 500; }
  .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
  .kv > div { display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 14px; }
  .kv .icon { color: var(--fg-muted); }
  .kv dt { color: var(--fg-muted); }
  .kv dd { margin: 0 0 0 auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fanbar { height: 4px; background: var(--muted); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .fanbar > div { height: 100%; background: var(--fg-muted); transition: width var(--dur-slow); }
  .fans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; font-size: 13px; }
  .fans span { color: var(--fg-muted); } .fans b { float: right; font-family: var(--font-mono); font-weight: 500; }

  /* AMS */
  .ams-unit + .ams-unit { margin-top: 16px; }
  .ams-head { font-size: 13px; color: var(--fg-muted); display: flex; gap: 14px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .ams-head b { color: var(--fg); font-size: 14px; }
  .ams-head span { display: inline-flex; gap: 4px; align-items: center; }
  .slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 479px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .slot { border: 2px solid transparent; border-radius: var(--radius-sm); background: var(--muted); padding: 10px 6px; text-align: center; font-size: 13px; min-width: 0; }
  .slot.active { border-color: var(--accent); background: var(--accent-tint); }
  .swatch { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 6px; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .45); }
  .slot.empty .swatch { background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(128, 128, 128, .35) 4px 6px); }
  .slot b { display: block; font-size: 14px; }
  .slot small { display: block; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.active small { color: var(--accent); font-weight: 600; }
  .rem { height: 3px; background: color-mix(in srgb, var(--fg-muted) 25%, transparent); border-radius: 999px; margin: 6px 8px 0; overflow: hidden; }
  .rem > div { height: 100%; background: var(--fg-muted); }

  /* send */
  #drop { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 28px 16px; text-align: center; cursor: pointer;
    transition: border-color var(--dur-fast), background var(--dur-fast); }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-tint); }
  #drop .icon { width: 28px; height: 28px; color: var(--accent); }
  #drop strong { display: block; font-size: 16px; margin: 8px 0 2px; }
  #drop span { color: var(--fg-muted); font-size: 14px; }
  .opts { display: grid; gap: 4px; margin-top: 12px; }
  .check { display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
  .result { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .result h3 { margin: 0 0 4px; font-size: 14px; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: center; }
  .result .rmeta { font-size: 13px; color: var(--fg-muted); margin-bottom: 10px; display: flex; gap: 6px; align-items: flex-start; }
  .result .rmeta.ok { color: var(--accent); } .result .rmeta.warn { color: var(--warn); } .result .rmeta.err { color: var(--danger); }
  .result pre { background: var(--muted); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0 0 12px; font: 12px/1.6 var(--font-mono);
    overflow-x: auto; max-height: 160px; }

  /* dialog */
  dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); padding: 0;
    width: min(520px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0, 0, 0, .35); }
  dialog::backdrop { background: rgba(2, 6, 23, .55); }
  dialog[open] { animation: pop var(--dur-base) ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 20px; display: grid; gap: 14px; }
  .help { font-size: 14px; color: var(--fg-muted); margin: 0; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 14px; font-weight: 600; }
  .field input { min-height: 44px; font: 16px var(--font-sans); color: var(--fg); background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 0 12px; }
  .field .hint { font-size: 12px; color: var(--fg-muted); }
  .found { display: grid; gap: 8px; }
  .found .btn { justify-content: flex-start; text-align: left; font-weight: 500; }
  .form-msg { font-size: 14px; min-height: 1.5em; margin: 0; }
  .form-msg.err { color: var(--danger); } .form-msg.ok { color: var(--accent); }

  details.info { margin-top: 24px; font-size: 14px; color: var(--fg-muted); }
  details.info summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  details.info code { font-family: var(--font-mono); font-size: 13px; background: var(--muted); padding: 1px 5px; border-radius: 4px; }
  footer { margin-top: 24px; color: var(--fg-muted); font-size: 12px; text-align: center; }
  #offline { border-color: var(--danger); color: var(--danger); display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }

  /* narrow cards: stack key/value rows and fans (kept last so it wins) */
  @media (max-width: 479px), (min-width: 900px) and (max-width: 1060px) {
    .kv, .fans { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>

let lang = 'en';
try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
if (!T[lang]) lang = (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en';
const t = k => T[lang][k] ?? T.en[k];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t(el.dataset.t);
    if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('[data-t-label]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tLabel)));
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  loadConfig();
  if (lastStatus) render(lastStatus);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} applyLang(); poll();
});

// ---------- file processing ----------
async function call(file, send) {
  const q = new URLSearchParams({ name: file.name, send: send ? 1 : 0, fast: $('optFast').checked ? 1 : 0 });
  const res = await fetch('/process?' + q, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'Failed');
  return j;
}
function card(file) {
  const div = document.createElement('div'); div.className = 'result';
  div.innerHTML = `<h3>${ICON('file', 'sm')}<span></span></h3><div class="rmeta"></div><pre hidden></pre><div class="row"></div>`;
  div.querySelector('h3 span').textContent = file.name;
  $('out').prepend(div);
  return div;
}
function setMeta(meta, cls, icon, text) { meta.className = 'rmeta ' + cls; meta.innerHTML = icon ? ICON(icon, 'sm') : ''; meta.append(document.createTextNode(text)); }
function show(div, file, r, err) {
  const meta = div.querySelector('.rmeta'), pre = div.querySelector('pre'), row = div.querySelector('.row');
  row.innerHTML = '';
  if (err) return setMeta(meta, 'err', 'alert', t('error') + err);
  const n = r.removed.length;
  if (r.sendError) setMeta(meta, 'err', 'alert', (n ? t('removed')(n) : '') + ' ' + r.sendError + t('stillDl'));
  else if (!n) setMeta(meta, 'warn', 'info', t('none'));
  else setMeta(meta, r.sent ? 'ok' : '', 'check', t('removed')(n) + (r.sent ? t('opened') : ''));
  if (n) { pre.hidden = false; pre.textContent = r.removed.map(x => `${x.where}:  ${x.code}`).join('\n'); }
  const sendBtn = document.createElement('button'); sendBtn.type = 'button';
  sendBtn.className = 'btn' + (r.sent ? ' secondary' : '');
  sendBtn.innerHTML = ICON('send'); sendBtn.append(r.sent ? t('sendAgain') : t('send'));
  sendBtn.onclick = () => run(file, true, div);
  const dl = document.createElement('a'); dl.className = 'btn secondary'; dl.innerHTML = ICON('download'); dl.append(t('download'));
  dl.href = '/download?f=' + encodeURIComponent(r.outName);
  row.append(sendBtn, dl);
}
async function run(file, send, div) {
  div = div || card(file);
  setMeta(div.querySelector('.rmeta'), '', '', t('working'));
  try { show(div, file, await call(file, send)); } catch (e) { show(div, file, null, e.message); }
}
function handle(files) { for (const f of files) run(f, $('optSend').checked); }
const drop = $('drop'), input = $('file');
drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
input.onchange = () => { handle([...input.files]); input.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle([...e.dataTransfer.files]));
for (const id of ['optSend', 'optFast']) {
  try { const v = localStorage.getItem(id); if (v !== null) $(id).checked = v === '1'; } catch (e) {}
  $(id).onchange = () => { try { localStorage.setItem(id, $(id).checked ? '1' : '0'); } catch (e) {} };
}

// ---------- printer status ----------
let lastStatus = null, camOn = false;
const fmtT = v => v == null ? '–' : Math.round(v) + '°';
function fmtMin(m) { if (m == null) return '–'; m = Math.max(0, m); const h = Math.floor(m / 60); return h ? `${h} h ${m % 60} min` : `${m} min`; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function setConn(cls, text, pulse) {
  $('connDot').className = 'dot ' + cls + (pulse ? ' pulse' : '');
  if ($('connText').textContent !== text) $('connText').textContent = text;
}

function render(s) {
  const configured = s.connection !== 'not configured';
  $('statusEmpty').hidden = configured;
  for (const id of ['cardTemps', 'cardMachine']) $(id).hidden = !configured || s.age == null;
  if (!configured) {
    setConn('', t('notConfigured'));
    $('statusBody').hidden = true; $('cardCam').hidden = true; $('cardAms').hidden = true; $('pMsg').textContent = '';
    $('pAlerts').innerHTML = ''; return;
  }
  const live = s.connection === 'connected' && s.age != null && s.age < 60;
  setConn(live ? 'on' : s.connection === 'error' ? 'bad' : 'wait', live ? t('live') : (t('conn')[s.connection] || s.connection), live);
  $('pMsg').className = 'p-msg' + (s.error ? ' err' : '');
  $('pMsg').textContent = s.error || (s.connection === 'connected' && s.age == null ? t('waiting') : '');
  $('statusBody').hidden = s.age == null;
  updateCam(s);
  if (s.age == null) return;

  const active = ['RUNNING', 'PAUSE', 'PREPARE'].includes(s.state);
  $('pName').textContent = s.printer.name || s.printer.ip || '';
  $('pState').textContent = t('states')[s.state] || s.state || '–';
  $('pJob').textContent = s.job || '';
  const pct = s.percent ?? 0, showPct = active || s.state === 'FINISH';
  $('pPct').innerHTML = showPct ? `${pct}<small>%</small>` : '';
  $('pBar').style.width = (showPct ? pct : 0) + '%';
  $('pBarWrap').setAttribute('aria-valuenow', showPct ? pct : 0);
  $('pLayer').textContent = s.total_layers ? `${s.layer ?? 0}/${s.total_layers}` : '–';
  $('pLeft').textContent = active ? fmtMin(s.remaining_min) : '–';
  $('pEta').textContent = active && s.remaining_min != null
    ? new Date(Date.now() + Math.max(0, s.remaining_min) * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '–';
  const st = $('pStage'), stName = (T[lang].stages || {})[s.stage_id] || s.stage;
  const showStage = active && stName && s.stage_id !== 0;
  st.hidden = !showStage;
  if (showStage) { st.className = 'stage' + (s.stage_id === 3 ? ' cali' : ''); st.innerHTML = ICON(s.stage_id === 3 ? 'alert' : 'info', 'sm'); st.append(stName); }
  document.title = active ? `${pct}% · NoCali` : 'NoCali';

  // alerts (one role=alert container; rebuilt only when content changes)
  const alerts = [...(s.print_error ? [{ ...s.print_error, level: 2, label: t('printError') }] : []), ...(s.hms || [])];
  const key = lang + JSON.stringify(alerts.map(a => a.code));
  if ($('pAlerts').dataset.key !== key) {
    $('pAlerts').dataset.key = key; $('pAlerts').innerHTML = '';
    for (const a of alerts) {
      const d = el('div', 'alert lvl' + a.level);
      d.innerHTML = ICON(a.level >= 4 ? 'info' : 'alert');
      const body = el('div'); body.append(el('b', null, a.label || t('hmsLevels')[a.level] || 'HMS'), document.createTextNode(a.text || ''));
      const meta = el('div', 'meta'); meta.append(el('span', 'mono', a.code));
      const link = el('a'); link.href = a.url; link.target = '_blank'; link.rel = 'noopener'; link.innerHTML = ICON('ext', 'sm'); link.append(t('details'));
      meta.append(link); body.append(meta); d.append(body); $('pAlerts').append(d);
    }
  }

  const tg = v => v ? ` <span>/ ${Math.round(v)}°</span>` : '';
  $('tNoz').innerHTML = fmtT(s.nozzle) + tg(s.nozzle_target);
  $('tBed').innerHTML = fmtT(s.bed) + tg(s.bed_target);
  $('tCh').textContent = fmtT(s.chamber);

  const kv = $('kv'); kv.innerHTML = '';
  const add = (icon, label, value) => {
    if (value == null || value === '') return;
    const d = el('div'); d.innerHTML = ICON(icon, 'sm'); d.append(el('dt', null, label), el('dd', null, value)); kv.append(d);
  };
  add('gauge', t('speed'), s.speed ? (t('speeds')[s.speed] || s.speed) + (s.speed_pct ? ` ${s.speed_pct}%` : '') : null);
  add('nozzle', t('nozzleInfo'), s.nozzle_diameter ? s.nozzle_diameter + ' mm' : null);
  add('wifi', t('wifi'), s.wifi ? s.wifi.replace('dBm', ' dBm') : null);
  add('bulb', t('light'), s.light ? (s.light === 'on' ? t('on') : s.light === 'off' ? t('off') : s.light) : null);
  const fans = $('fans'); fans.innerHTML = ''; const f = s.fans || {};
  for (const [k, label] of [['part', 'partFan'], ['aux', 'auxFan'], ['chamber', 'chamberFan']]) {
    if (f[k] == null) continue;
    const d = el('div'); d.append(el('span', null, t(label)), el('b', null, f[k] + '%'));
    const bar = el('div', 'fanbar'); const fill = el('div'); fill.style.width = f[k] + '%'; bar.append(fill); d.append(bar); fans.append(d);
  }
  renderAms(s.ams);
}

function slotEl(tr, label) {
  const d = el('div', 'slot' + (tr.active ? ' active' : '') + (tr.empty ? ' empty' : ''));
  const sw = el('div', 'swatch');
  if (!tr.empty) {
    const cols = tr.colors && tr.colors.length > 1 ? tr.colors : null;
    sw.style.background = cols ? `conic-gradient(${cols.join(',')})` : (tr.color || 'transparent');
  }
  d.append(sw, el('b', null, tr.empty ? t('emptySlot') : tr.type));
  d.append(el('small', null, tr.active ? t('active') : (tr.empty ? label : (tr.name || label))));
  if (!tr.empty && tr.remain != null) {
    const r = el('div', 'rem'); const fill = el('div'); fill.style.width = tr.remain + '%'; r.append(fill);
    r.setAttribute('role', 'img'); r.setAttribute('aria-label', tr.remain + '%'); d.append(r);
  }
  d.setAttribute('aria-label', `${label}: ${tr.empty ? t('emptySlot') : tr.type}${tr.active ? ', ' + t('active') : ''}${tr.remain != null ? ', ' + tr.remain + '%' : ''}`);
  return d;
}
function renderAms(a) {
  const box = $('ams'); box.innerHTML = '';
  const has = a && (a.units.length || a.external);
  $('cardAms').hidden = !has;
  if (!has) return;
  for (const u of a.units) {
    const w = el('div', 'ams-unit');
    const h = el('div', 'ams-head'); h.append(el('b', null, u.label));
    if (u.humidity != null) { const sp = el('span'); sp.innerHTML = ICON('drop', 'sm'); sp.append(`${t('humidity')} ${u.humidity}%`); h.append(sp); }
    if (u.temp != null) { const sp = el('span'); sp.innerHTML = ICON('therm', 'sm'); sp.append(`${Math.round(u.temp)}°`); h.append(sp); }
    const slots = el('div', 'slots');
    u.trays.forEach((tr, i) => slots.append(slotEl(tr, `${'ABCD'[u.id % 4] || u.id}${i + 1}`)));
    w.append(h, slots); box.append(w);
  }
  if (a.external) {
    const w = el('div', 'ams-unit'); const h = el('div', 'ams-head'); h.append(el('b', null, t('ext')));
    const slots = el('div', 'slots'); slots.append(slotEl(a.external, 'Ext'));
    w.append(h, slots); box.append(w);
  }
}

// camera: click-to-play, stops when hidden
function updateCam(s) {
  $('cardCam').hidden = !(s.camera || camOn);
  const img = $('camImg'), ov = $('camOverlay'), msg = $('camMsg');
  $('btnCamStop').hidden = !camOn; $('btnCamPlay').hidden = camOn;
  if (!camOn) { img.hidden = true; img.removeAttribute('src'); ov.hidden = false; msg.textContent = ''; return; }
  if (!s.camera_ffmpeg) { ov.hidden = false; msg.textContent = t('camNoFfmpeg'); return; }
  if (!s.camera) { ov.hidden = false; msg.textContent = t('camNone'); return; }
  if (!img.getAttribute('src')) { ov.hidden = false; msg.textContent = t('camLoading'); img.src = '/camera.mjpg?ts=' + Date.now(); }
}
$('camImg').onload = () => { $('camImg').hidden = false; $('camOverlay').hidden = true; };
$('camImg').onerror = async () => {
  const img = $('camImg'); img.removeAttribute('src'); img.hidden = true; $('camOverlay').hidden = false;
  try { const r = await fetch('/camera.jpg'); if (!r.ok) $('camMsg').textContent = t('camErr') + (await r.json()).error; } catch (e) {}
  setTimeout(() => { if (camOn && lastStatus) updateCam(lastStatus); }, 5000);
};
$('camImg').alt = '';
function setCam(on) { camOn = on; if (lastStatus) updateCam(lastStatus); }
$('btnCamPlay').onclick = () => setCam(true);
$('btnCamStop').onclick = () => setCam(false);
document.addEventListener('visibilitychange', () => { if (document.hidden && camOn) setCam(false); });

async function poll() {
  try {
    const s = await (await fetch('/status?lang=' + lang)).json();
    lastStatus = s; $('offline').hidden = true; render(s);
  } catch (e) { $('offline').hidden = false; setConn('bad', t('conn').error); }
}

// ---------- settings dialog ----------
const dlg = $('dlgSettings');
function openSettings() { $('cfgMsg').textContent = ''; loadConfig(); dlg.showModal(); }
$('btnSettings').onclick = openSettings;
$('btnSetup').onclick = openSettings;
$('btnClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
async function loadConfig() {
  try {
    const c = await (await fetch('/config')).json();
    if (dlg.open && document.activeElement && document.activeElement.form === $('cfgForm')) return;
    $('cIp').value = c.ip; $('cSerial').value = c.serial; $('cName').value = c.name;
    $('codeHint').textContent = c.hasCode ? t('codeSaved') : t('code8');
  } catch (e) {}
}
$('btnFind').onclick = async () => {
  const b = $('btnFind'), f = $('found');
  b.disabled = true; b.lastElementChild.textContent = t('searching'); f.innerHTML = '';
  try {
    const r = await (await fetch('/discover')).json();
    if (r.error) throw new Error(r.error);
    if (!r.printers.length) f.append(el('p', 'help', t('notFound')));
    for (const p of r.printers) {
      const btn = el('button', 'btn secondary'); btn.type = 'button'; btn.innerHTML = ICON('box');
      btn.append(`${p.name || p.model} · ${p.ip}`);
      btn.onclick = () => { $('cIp').value = p.ip; $('cSerial').value = p.serial; if (!$('cName').value) $('cName').value = p.name; $('cCode').focus(); };
      f.append(btn);
    }
  } catch (e) { f.append(el('p', 'help', e.message)); }
  b.disabled = false; b.lastElementChild.textContent = t('find');
};
$('cfgForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('cfgMsg');
  const body = { ip: $('cIp').value, serial: $('cSerial').value, name: $('cName').value, code: $('cCode').value };
  const res = await fetch('/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json();
  msg.className = 'form-msg ' + (res.ok ? 'ok' : 'err');
  msg.textContent = res.ok ? t('saved') : j.error;
  if (res.ok) { $('cCode').value = ''; setCam(false); loadConfig(); setTimeout(() => dlg.close(), 900); poll(); }
};

fetch('/health').then(r => r.json()).then(h => { $('ver').textContent = 'v' + h.version; }).catch(() => {});
applyLang(); poll(); setInterval(poll, 2000);
</script>
</body>
